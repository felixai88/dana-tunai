<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATUN</title>
    <link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
    <style>
        body { background-color: #f5f6fa; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        #form-container { width: 80%; max-width: 600px; margin: 20px auto; background-color: #ffffff; border: 1px solid #e1e4e8; border-radius: 8px; box-shadow: 0 0 10px rgba(0, 0, 0, 0.1); padding: 30px; }
        #form-container h2 { text-align: center; color: #1e90ff; margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; color: #333333; font-weight: bold; }
        
        input[type="text"], input[type="date"], select {
            width: 100%; padding: 10px; margin-bottom: 20px; border: 1px solid #ced4da; border-radius: 4px; font-size: 16px; color: #495057; box-sizing: border-box;
        }

        .select2-container--default .select2-selection--single {
            height: 41px !important;
            padding: 6px;
            border: 1px solid #ced4da !important;
        }
        .select2-container { margin-bottom: 20px !important; width: 100% !important; }

        input[type="submit"] { background-color: #1e90ff; color: #ffffff; border: none; border-radius: 4px; padding: 12px 20px; font-size: 16px; cursor: pointer; width: 100%; margin-top: 10px; font-weight: bold; }
        input[type="submit"]:hover { background-color: #0d6efd; }
        #footer { text-align: center; margin-top: 20px; font-size: 12px; color: #666666; padding-bottom: 30px; }
    </style>
</head>

<body>
    <div id="form-container">
        <h2>DANA TUNAI</h2>
        <form action="https://script.google.com/macros/s/AKfycbwtdmVa_R0f2c05TjlB32KxfMhPJII9gY7IxID52NqPQUtXsF4PZ4lvI0HUlTT_wSEv/exec" method="post" onsubmit="convertToUpper(event)">

            <label for="namaD">NAMA DEBITUR:</label>
            <input type="text" id="namaD" name="namaD" required>

            <label for="IDPEL">IDPEL:</label>
            <input type="text" id="IDPEL" name="IDPEL" required>
 	    <label for="tangalin">Tanggal Input:</label>
            <input type="date" id="tangalin" name="tangalin" required>


	    <label for="jenistf">JENIS TRANSFER:</label>
            <select id="jenistf" name="jenistf" required>
                <option value="702">CMD</option>
            </select>

          

            <label for="namaBTB">NAMA DI BUKU TABUNGAN:</label>
            <input type="text" id="namaBTB" name="namaBTB" required>

            <label for="norekd">NO REKENING DEBITUR:</label>
            <input type="text" id="norekd" name="norekd" required>

            <label for="bankd">NAMA BANK DEBITUR:</label>
            <select id="bankd" name="bankd" class="search-box" required>
                <option value="">Ketik nama bank...</option>
               
            </select>

            <label for="cab">Cabang:</label>
            <select id="cab" name="cab" class="search-box" required>
                <option value="">Ketik nama cabang...</option>
                <option value="KSN">KSN</option><option value="PMS">PMS</option><option value="RAP">RAP</option>
                <option value="PSP">PSP</option><option value="NR">NR</option><option value="BJI">BJI</option>
                <option value="PHU">PHU</option><option value="BNA">BNA</option><option value="BRN">BRN</option>
                <option value="LSM">LSM</option><option value="LGS">LGS</option><option value="MLH">MLH</option>
                <option value="TTN">TTN</option><option value="SBM">SBM</option><option value="TKN">TKN</option>
                <option value="BKJ">BKJ</option><option value="KTC">KTC</option><option value="PLB">PANTON LABU</option>
                <option value="SIMP">KUALA SIMPANG</option><option value="PBR">PBR</option><option value="DMI">DMI</option>
                <option value="DRI">DRI</option><option value="UBT">UBT</option><option value="BBT">BBT</option>
                <option value="AMK">AMK</option><option value="FLM">FLM</option><option value="UJT">UJT</option>
                <option value="PRB">PRB</option><option value="PASIR">PASIR</option><option value="TLK">TLK</option>
                <option value="KDS">KDS</option><option value="SRK">SRK</option><option value="PRG">PRG</option>
                <option value="BTM">BTM</option><option value="PDG">PDG</option><option value="JKT">JKT</option><option value="PKC">PKC</option>
            </select>

            <label for="pin">NOMINAL PINJAMAN:</label>
            <input type="text" id="pin" name="pin" required oninput="formatCurrency(this)">

            <label for="notf">NOMINAL TRANSFER:</label>
            <input type="text" id="notf" name="notf" required oninput="formatCurrency(this)">

            <label for="ten">TENOR:</label>
            <select id="ten" name="ten" required>
                <option value="">Pilih Tenor...</option>
                <option value="6">6</option><option value="12">12</option><option value="18">18</option>
                <option value="24">24</option><option value="30">30</option><option value="36">36</option><option value="48">48</option>
            </select>

            <label for="ketd">Keterangan:</label>
            <select id="ketd" name="ketd" required>
                <option value="">Pilih keterangan...</option>
                <option value="MODAL USAHA DARI PT CMD">MODAL USAHA DARI PT CMD</option>
                <option value="MURAHBAHA MURAHBAHA DARI PT CMD">MURAHBAHA DARI PT CMD </option>
                <option value="FASILITAS DANA DARI PT CMD">FASILITAS DANA DARI PT CMD</option>
            </select>

            <label for="lpk">NOMINAL LPK KASIR:</label>
            <input type="text" id="lpk" name="lpk" required oninput="formatCurrency(this)">

            <label for="cmd">NAMA BANK CMD:</label>
            <select id="cmd" name="cmd" required>
                <option value="022,0026,BANK CIMB NIAGA">CIMB</option>
            </select>

            <label for="norekcmd">NOREK LPK:</label>
            <select id="norekcmd" name="norekcmd" required>
                <option value="800069817300">800069817300 CIMB KONVENSIONAL</option>
                <option value="860013097400">860013097400 CIMB SYARIAH</option>
            </select>

            <label for="ptcmd">NAMA DI BUKU TABUNGAN CMD:</label>
            <select id="ptcmd" name="ptcmd" required>
                <option value="CAPELLA MULTIDANA">CMD</option>
            </select>

            <label for="ketl">Keterangan LPK:</label>
            <select id="ketl" name="ketl" required>
                <option value="PENGGANTIAN LPK KASIR">PENGGANTIAN LPK KASIR</option>
            </select>

            <label for="agen">NAMA BUKU TABUNGAN AGEN:</label>
            <input type="text" id="agen" name="agen" required>

            <label for="agen1">NOREK AGEN:</label>
            <input type="text" id="agen1" name="agen1" required>

            <label for="bankspv">BANK AGEN:</label>
            <select id="bankspv" name="bankspv" class="search-box" required>
                <option value="">Ketik nama bank...</option>
                <option value="002,BANK RAKYAT INDONESIA">BRI</option>
                <option value="008,BANK MANDIRI">MANDIRI</option>
                <option value="014,BANK CENTRAL ASIA">BCA</option>
                <option value="426,BANK MEGA">MEGA</option>
                <option value="009,BANK NEGARA INDONESIA 1946">BNI</option>
                <option value="022,BANK CIMB NIAGA">CIMB</option>
                <option value="117,BANK SUMUT">SUMUT</option>
                <option value="451,BANK SYARIAH INDONESIA">BSI</option>
            </select>

            <label for="nominalspv">NOMINAL TRANSFER AGEN:</label>
            <input type="text" id="nominalspv" name="nominalspv" required oninput="formatCurrency(this)">

            <label for="ketp">Keterangan Transfer Agen:</label>
            <select id="ketp" name="ketp" required>
                <option value="INC DATUN DARI PT CMD">INC DATUN DARI PT CMD</option>
            </select>

            <label for="Ro/Non">NON/RO:</label>
            <select id="Ro/Non" name="Ro/Non" required>
                <option value="RO">RO</option>
                <option value="NON">NON</option>
            </select>

            <label for="CMO">NAMA CMO:</label>
            <select id="CMO" name="CMO" class="search-box" required>
                <option value="">Memuat data...</option>
            </select>

            <input type="submit" value="Simpan Data">
        </form>
    </div>

    <div id="footer">
        SALAM HANGAT DARI PT CAPELLA MULTIDANA
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

    <script>
        $(document).ready(function() {
            // Aktifkan Select2
            $('.search-box').select2({
                placeholder: "Klik untuk mencari...",
                allowClear: true
            });

              // API URL
    const urlCMO = "https://script.google.com/macros/s/AKfycbwgNJ6GIM192RjJ3wB2Fz_8CcYNBVL385urLfstj0fNkULwitBOiI5ps2McEgWG7CGq7Q/exec";
    const urlBank = "https://script.google.com/macros/s/AKfycbyKMOjjAIlO28t9OoFlIN1pQUxo0fGvfDbAF5ZE0Xobt_JZRmKKhK5zpryZrbbX1loChw/exec";

    // 1. Ambil Data CMO
    fetch(urlCMO)
    .then(res => res.json())
    .then(data => {
        isiDropdown("CMO", data, "Pilih CMO");
    })
    .catch(err => {
        console.error("Gagal load CMO:", err);
        $("#CMO").html('<option>Gagal memuat data</option>');
    });

    // 2. Ambil Data BANK
    fetch(urlBank)
    .then(res => res.json())
    .then(data => {
        isiDropdown("bankd", data, "Pilih Nama Bank");
    })
    .catch(err => {
        console.error("Gagal load Bank:", err);
        $("#bankd").html('<option>Gagal memuat data</option>');
    });

    // Fungsi Reusable untuk mengisi dropdown
    function isiDropdown(idElemen, data, placeholder) {
        let select = document.getElementById(idElemen);
        select.innerHTML = `<option value="">${placeholder}</option>`;

        data.forEach(item => {
            let nama = (typeof item === "object") ? (item.nama || item[0]) : item;
            if (nama) {
                let opt = document.createElement("option");
                opt.value = nama.toString().toUpperCase();
                opt.textContent = nama.toString().toUpperCase();
                select.appendChild(opt);
            }
        });
        // Update tampilan Select2
        $(`#${idElemen}`).trigger('change');
    }

});
    </script>
</body>
</html>
